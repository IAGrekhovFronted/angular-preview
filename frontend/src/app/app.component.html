<div class="app-wrapper">
  <div class="app-wrapper__body">
    <div class="app-wrapper__main">
      <header>
        <h1>Preview TEST</h1>
      </header>
      <nav class="app-wrapper_nav">
        <a routerLink="/pdf-preview" routerLinkActive="active">PDF Preview</a>
        <a routerLink="/docx-preview" routerLinkActive="active">DOCX Preview</a>
      </nav>
      <router-outlet></router-outlet>
    </div>

    <app-aside-modal
      *ngIf="asideModal.state$ | async as asideState"
      [opened]="asideState.opened"
      [title]="asideState.title"
      (close)="asideModal.close()"
    >
      <app-pdf-preview
        *ngIf="asideState.data"
        [src]="asideState.data"
        [scale]="100"
      ></app-pdf-preview>
    </app-aside-modal>
  </div>
</div>
