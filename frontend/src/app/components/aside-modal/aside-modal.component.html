<div class="aside-modal" [class.aside-modal--open]="state.opened">
  <button
    type="button"
    class="aside-modal__backdrop"
    aria-label="Закрыть"
    (click)="close()"
  ></button>

  <aside class="aside-modal__panel" [attr.aria-hidden]="!state.opened">
    <header class="aside-modal__header">
      <h2 class="aside-modal__title" *ngIf="state.title">{{ state.title }}</h2>
      <button
        type="button"
        class="aside-modal__close"
        aria-label="Закрыть"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <div class="aside-modal__content">
      <ng-template #contentHost></ng-template>
    </div>
  </aside>
</div>
