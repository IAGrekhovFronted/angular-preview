<div class="pdf-preview">
  <div class="pdf-preview__toolbar">
    <button
      type="button"
      class="pdf-preview__btn"
      (click)="zoomOut()"
      [disabled]="state.loading || !state.totalPages"
      title="Уменьшить"
    >
      −
    </button>
    <span class="pdf-preview__zoom">{{ scalePercent }}%</span>
    <button
      type="button"
      class="pdf-preview__btn"
      (click)="zoomIn()"
      [disabled]="state.loading || !state.totalPages"
      title="Увеличить"
    >
      +
    </button>
    <span class="pdf-preview__count" *ngIf="state.totalPages">
      Страниц: {{ state.totalPages }}
    </span>
  </div>

  <div class="pdf-preview__viewport">
    <div class="pdf-preview__status" *ngIf="state.loading">Загрузка PDF…</div>
    <div class="pdf-preview__status pdf-preview__status--error" *ngIf="state.error">
      {{ state.error }}
    </div>
    <div #pagesContainer class="pdf-preview__pages-list"></div>
  </div>
</div>
